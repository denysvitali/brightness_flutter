name: Flutter CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: devenv shell -- flutter pub get

      - name: Analyze
        run: devenv shell -- flutter analyze

      - name: Test
        run: devenv shell -- flutter test

      - name: Build debug APK
        run: devenv shell -- flutter build apk --debug --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brightness-flutter-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: devenv shell -- flutter pub get

      - name: Build release APK
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))
          devenv shell -- flutter build apk --release --no-pub \
            --target-platform android-arm64 \
            --build-number "$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/brightness-flutter-${{ github.ref_name }}.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brightness-flutter-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/brightness-flutter-${{ github.ref_name }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Brightness Flutter ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/brightness-flutter-${{ github.ref_name }}.apk
